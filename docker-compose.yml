version: '3.8'

# ==============================================================================
# NEXORA — Production Docker Compose Specification
# "Enter the Grid. Outsmart the Network."
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexora}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nexora-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${PORT:-4000}:4000'
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/${POSTGRES_DB:-nexora}
      JWT_SECRET: ${JWT_SECRET:-production_super_secure_nexora_jwt_token_2026_secret}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4000,http://localhost:5173}
      OPERATOR_SECRET: ${OPERATOR_SECRET:-nexora_prod_operator_vault_secret_99}
      OPERATOR_USERNAMES: ${OPERATOR_USERNAMES:-nexus_admin,lead_operator}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-60}
      BODY_LIMIT: ${BODY_LIMIT:-100kb}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - nexora-network

volumes:
  postgres_data:
    driver: local

networks:
  nexora-network:
    driver: bridge
